[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sukupol-game-api"
version = "0.1.0"
description = "Authoritative game API for the Sukupol ASCII rogue-lite prototype"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
llm = [
  "agent-framework",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.13.2",
    "pytest>=8.0",
    "httpx>=0.27",
]
